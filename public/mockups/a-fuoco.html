<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOCKUP A — Fuoco e Braci</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --carbone:#120a04; --brace:#ff7a1e; --brace-viva:#ffb45e; --fiamma:#ff5210; --oro-caldo:#f0c060;
    --ink:#f6ead2; --muted:#c4a582;
  }
  html, body { height:100%; }
  body { background:var(--carbone); color:var(--ink); font-family:"EB Garamond",Georgia,serif; overflow:hidden; }

  .world { position:fixed; inset:0; overflow:hidden;
    background:
      radial-gradient(90% 55% at 50% 112%, rgba(255,82,16,.28), transparent 62%),
      linear-gradient(180deg,#1a0e06,#120a04 55%,#0a0502); }
  #tizzoni { position:absolute; inset:0; }

  .phone { position:relative; width:min(430px,100vw); height:100dvh; max-height:930px;
    margin:0 auto; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; background:#0d0703; }
  .phone::-webkit-scrollbar{ display:none; }
  @media (min-width:520px){
    .phone { height:92vh; margin-top:4vh; border-radius:42px; border:1px solid rgba(255,122,30,.4);
      box-shadow:0 0 0 8px #1c0f06, 0 0 100px -22px rgba(255,90,16,.6), 0 40px 120px -30px #000; }
  }

  /* ══ LAYOUT A: CINEMA VERTICALE — hero full-bleed che sfuma nel fuoco ══ */
  .hero { position:relative; min-height:88%; display:flex; flex-direction:column;
    justify-content:flex-end; cursor:pointer; user-select:none; }
  .hero-img { position:absolute; inset:0; overflow:hidden; }
  .hero-img img { width:100%; height:100%; object-fit:cover; object-position:center 28%;
    transform:scale(1.04); transition:transform 6s ease-out; }
  .hero:active .hero-img img { transform:scale(1.1); }
  .hero-fumo { position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(13,7,3,.55) 0%, transparent 26%,
      transparent 55%, rgba(13,7,3,.86) 82%, #0d0703 100%); }
  /* vampata al tocco */
  .vampata { position:absolute; left:0; right:0; bottom:0; height:55%; pointer-events:none; opacity:0;
    background:
      radial-gradient(70% 90% at 50% 105%, rgba(255,180,94,.85), rgba(255,82,16,.55) 45%, transparent 75%);
    filter:blur(6px); transition:opacity .18s ease-out; mix-blend-mode:screen; }
  .hero.arde .vampata { opacity:1; }
  .hero-testo { position:relative; z-index:2; padding:0 24px 26px; text-align:left; }
  .kicker { display:inline-block; font-family:"Cinzel",serif; font-size:.58rem; letter-spacing:.34em;
    text-transform:uppercase; color:var(--brace-viva); border-left:3px solid var(--fiamma);
    padding:2px 0 2px 10px; margin-bottom:10px; text-shadow:0 0 12px rgba(255,122,30,.7); }
  .hero-testo h1 { font-family:"Cinzel Decorative",serif; font-weight:900;
    font-size:clamp(2rem,9.4vw,2.9rem); line-height:1.04;
    background:linear-gradient(180deg,#fff3da,var(--brace-viva) 48%,var(--fiamma) 88%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 22px rgba(255,90,16,.5)); }
  .hero-testo p { color:var(--muted); font-size:.94rem; max-width:34ch; margin:10px 0 16px; line-height:1.55; font-style:italic; }
  .fila-cta { display:flex; gap:10px; align-items:center; }
  .cta { display:inline-flex; align-items:center; gap:8px; padding:13px 24px; border-radius:6px;
    font-family:"Cinzel",serif; font-weight:700; font-size:.76rem; letter-spacing:.12em; color:#2a1204;
    background:linear-gradient(180deg,#ffe9b0,var(--brace-viva) 50%,var(--fiamma)); border:none;
    box-shadow:0 0 36px -6px rgba(255,90,16,.95), inset 0 1px 0 rgba(255,255,255,.6); }
  .cta--spettro { background:none; color:var(--brace-viva); border:1px solid rgba(255,122,30,.5);
    box-shadow:0 0 20px -8px rgba(255,90,16,.7); }
  .tocca-hint { position:absolute; top:16px; right:16px; z-index:2; font-family:"Cinzel",serif;
    font-size:.56rem; letter-spacing:.24em; text-transform:uppercase; color:var(--brace-viva);
    background:rgba(13,7,3,.55); border:1px solid rgba(255,122,30,.45); border-radius:999px;
    padding:6px 12px; backdrop-filter:blur(6px); animation:hintPulsa 2.4s ease-in-out infinite alternate; }
  @keyframes hintPulsa { from{ opacity:.6; } to{ opacity:1; box-shadow:0 0 18px -4px rgba(255,122,30,.8);} }

  /* ══ PELLICOLA ORIZZONTALE: le cronache scorrono di lato ══ */
  .pellicola-sez { padding:26px 0 120px; }
  .sez-testa { display:flex; align-items:baseline; justify-content:space-between; padding:0 22px 14px; }
  .sez-testa h2 { font-family:"Cinzel",serif; font-size:.95rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--oro-caldo); }
  .sez-testa span { font-family:"Cinzel",serif; font-size:.58rem; letter-spacing:.2em;
    color:var(--muted); text-transform:uppercase; }
  .pellicola { display:flex; gap:14px; overflow-x:auto; padding:4px 22px 18px;
    scroll-snap-type:x mandatory; scrollbar-width:none; }
  .pellicola::-webkit-scrollbar{ display:none; }
  .fotogramma { flex:0 0 78%; scroll-snap-align:center; position:relative; border-radius:12px;
    overflow:hidden; aspect-ratio:4/5; border:1px solid rgba(255,122,30,.4);
    box-shadow:0 0 0 1px #2a180a, 0 18px 44px -16px #000, 0 0 30px -12px rgba(255,90,16,.5); }
  .fotogramma img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:saturate(1.05) contrast(1.02); }
  .fotogramma .velo { position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 40%, rgba(13,7,3,.9)); }
  .fotogramma .brace-bordo { position:absolute; left:0; right:0; bottom:0; height:3px;
    background:linear-gradient(90deg,var(--fiamma),var(--brace-viva),var(--fiamma));
    box-shadow:0 0 14px rgba(255,90,16,.9); animation:hintPulsa 2.8s ease-in-out infinite alternate; }
  .fotogramma figcaption { position:absolute; left:0; right:0; bottom:0; padding:14px 14px 12px; }
  .fotogramma h3 { font-family:"Cinzel",serif; font-size:.95rem; letter-spacing:.06em; color:#fff; }
  .fotogramma small { display:block; color:var(--muted); font-size:.78rem; font-style:italic; margin-top:2px; }
  .fotogramma .tag { position:absolute; top:10px; left:10px; font-family:"Cinzel",serif; font-size:.54rem;
    letter-spacing:.18em; text-transform:uppercase; color:#2a1204; padding:4px 10px; border-radius:3px;
    background:linear-gradient(180deg,#ffe9b0,var(--brace-viva)); }

  /* nav focolare */
  .focolare { position:sticky; bottom:14px; margin:0 16px; display:flex; justify-content:space-around;
    align-items:center; padding:10px 8px calc(10px + env(safe-area-inset-bottom));
    border-radius:22px; background:rgba(20,10,4,.86); border:1px solid rgba(255,122,30,.45);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 -4px 44px -12px rgba(255,90,16,.55), 0 20px 40px -18px #000; z-index:10; }
  .focolare a { display:flex; flex-direction:column; align-items:center; gap:3px; text-decoration:none;
    color:var(--muted); font-family:"Cinzel",serif; font-size:.55rem; letter-spacing:.14em;
    text-transform:uppercase; min-width:50px; padding:4px 0; }
  .focolare a i { font-style:normal; font-size:1.05rem; color:#8a5c34; }
  .focolare a.on { color:var(--brace-viva); }
  .focolare a.on i { color:var(--brace-viva);
    text-shadow:0 0 14px rgba(255,122,30,1), 0 0 30px rgba(255,90,16,.8); }

  .badge-opt { position:fixed; top:12px; left:12px; z-index:50; font-family:"Cinzel",serif; font-size:.6rem;
    letter-spacing:.22em; color:#2a1204; background:linear-gradient(180deg,#ffe9b0,var(--brace-viva));
    padding:7px 14px; border-radius:999px; box-shadow:0 0 26px -4px rgba(255,122,30,.9); }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; } #tizzoni{ display:none; } }
</style>
</head>
<body>
  <div class="badge-opt">A · FUOCO E BRACI</div>
  <div class="world"><canvas id="tizzoni"></canvas></div>

  <div class="phone">
    <section class="hero" id="hero">
      <div class="tocca-hint">🔥 tocca: il segugio soffia</div>
      <div class="hero-img"><img src="/assets/PhotoStory/GruppoMEAA/hellhound.png" alt="Il segugio infernale"></div>
      <div class="hero-fumo"></div>
      <div class="vampata" id="vampata"></div>
      <div class="hero-testo">
        <span class="kicker">Cronache di Exanthia · La Fucina</span>
        <h1>Il Mondo<br>di Eldoria</h1>
        <p>Il segugio veglia sulla soglia: oltre il suo fiato, le storie forgiate dei quattro party.</p>
        <div class="fila-cta">
          <button class="cta">Entra nella Fucina</button>
          <button class="cta cta--spettro">Le Cronache</button>
        </div>
      </div>
    </section>

    <section class="pellicola-sez">
      <div class="sez-testa"><h2>Forgiate nel Fuoco</h2><span>scorri →</span></div>
      <div class="pellicola">
        <figure class="fotogramma">
          <img src="/assets/PhotoStory/GruppoENOX/combatRana.png" alt="">
          <div class="velo"></div><div class="brace-bordo"></div>
          <span class="tag">Eroi</span>
          <figcaption><h3>Registro degli Eroi</h3><small>16 anime temprate · 4 compagnie</small></figcaption>
        </figure>
        <figure class="fotogramma">
          <img src="/assets/PhotoStory/GruppoENOX/voragine.png" alt="">
          <div class="velo"></div><div class="brace-bordo"></div>
          <span class="tag">Gilda</span>
          <figcaption><h3>Mercato Nero</h3><small>3 aste che scottano ancora</small></figcaption>
        </figure>
        <figure class="fotogramma">
          <img src="/assets/PhotoStory/GruppoMEAA/SylvaBerserk.png" alt="">
          <div class="velo"></div><div class="brace-bordo"></div>
          <span class="tag">Memorie</span>
          <figcaption><h3>Codice delle Memorie</h3><small>Capitolo XXVII, ancora caldo</small></figcaption>
        </figure>
      </div>

      <nav class="focolare">
        <a class="on" href="#"><i>ᛖ</i>Home</a>
        <a href="#"><i>ᚠ</i>Mondo</a>
        <a href="#"><i>ᛒ</i>Eroi</a>
        <a href="#"><i>ᚷ</i>Gilda</a>
        <a href="#"><i>ᛗ</i>Menu</a>
      </nav>
    </section>
  </div>

<script>
  /* Tizzoni ambientali + FEATURE: tocca l'hero → vampata + scintille dal punto di tocco */
  const cv=document.getElementById('tizzoni'), cx=cv.getContext('2d');
  let W,H,pp=[],burst=[];
  const mk=f=>({x:Math.random()*W, y:f?H+10+Math.random()*30:Math.random()*H,
    r:.8+Math.random()*2, v:.35+Math.random()*.65, d:(Math.random()-.5)*.3, ph:Math.random()*7, fl:.5+Math.random()*.5});
  const rs=()=>{ W=cv.width=innerWidth; H=cv.height=innerHeight;
    pp=Array.from({length:W<600?28:52},()=>mk(false)); };
  rs(); addEventListener('resize',rs);
  let t=0;
  (function tick(){ t++; cx.clearRect(0,0,W,H);
    for(let i=0;i<pp.length;i++){ const p=pp[i];
      p.y-=p.v; p.x+=p.d+Math.sin(t/60+p.ph)*.2;
      if(p.y<-10) pp[i]=mk(true);
      const a=Math.max(0,(.5+.5*Math.sin(t/9*p.fl+p.ph))*Math.min(1,p.y/(H*.4)));
      cx.fillStyle=`rgba(255,122,34,${(.15*a).toFixed(3)})`;
      cx.beginPath(); cx.arc(p.x,p.y,p.r*3.4,0,7); cx.fill();
      cx.fillStyle=`rgba(255,180,94,${(.9*a).toFixed(3)})`;
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); }
    for(let i=burst.length-1;i>=0;i--){ const s=burst[i];
      s.x+=s.vx; s.y+=s.vy; s.vy+=.06; s.life-=1;
      if(s.life<=0){ burst.splice(i,1); continue; }
      const a=s.life/s.max;
      cx.fillStyle=`rgba(255,${150+Math.floor(80*a)},60,${a.toFixed(2)})`;
      cx.beginPath(); cx.arc(s.x,s.y,1.4+a*1.6,0,7); cx.fill(); }
    requestAnimationFrame(tick);
  })();

  const hero=document.getElementById('hero');
  let ardeT=null;
  hero.addEventListener('pointerdown', e=>{
    hero.classList.add('arde');
    clearTimeout(ardeT); ardeT=setTimeout(()=>hero.classList.remove('arde'), 600);
    for(let i=0;i<24;i++){ const an=-Math.PI/2+(Math.random()-.5)*1.8, sp=2+Math.random()*4.5;
      burst.push({x:e.clientX,y:e.clientY,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,life:38+Math.random()*30,max:68}); }
  });
</script>
</body>
</html>
