<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOCKUP E — Carta Stellare</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --notte:#0b0d24; --indaco:#141838; --ottone:#d9a45b; --ottone-vivo:#f0cfa0;
    --stella:#f5f2ff; --alone:#8b93e8; --ink:#e9e8f4; --muted:#9295b8;
  }
  html, body { height:100%; }
  body { background:var(--notte); color:var(--ink); font-family:"EB Garamond",Georgia,serif; overflow:hidden; }

  .world { position:fixed; inset:0; overflow:hidden;
    background:
      radial-gradient(55% 45% at 75% 15%, rgba(139,147,232,.14), transparent 60%),
      radial-gradient(45% 40% at 15% 85%, rgba(217,164,91,.08), transparent 60%),
      linear-gradient(180deg,#121540,#0b0d24 55%,#06071a); }
  #cielo { position:absolute; inset:0; }

  .phone { position:relative; width:min(430px,100vw); height:100dvh; max-height:930px;
    margin:0 auto; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; background:#0c0e28; }
  .phone::-webkit-scrollbar{ display:none; }
  @media (min-width:520px){
    .phone { height:92vh; margin-top:4vh; border-radius:42px; border:1px solid rgba(217,164,91,.45);
      box-shadow:0 0 0 8px #101230, 0 0 90px -22px rgba(139,147,232,.5), 0 40px 120px -30px #000; }
  }

  /* ══ HERO: IL QUADRANTE — astrolabio d'ottone con anello graduato ══ */
  .hero { position:relative; padding:56px 18px 8px; text-align:center; }
  .quadrante { position:relative; margin:0 auto; width:100%; max-width:370px; aspect-ratio:3/3.2;
    overflow:hidden; cursor:crosshair; user-select:none;
    border-radius:50% 50% 16px 16px / 42% 42% 16px 16px;
    border:2px solid var(--ottone);
    box-shadow:0 0 0 5px #0c0e28, 0 0 0 6px rgba(217,164,91,.5),
      0 0 60px -12px rgba(139,147,232,.55), inset 0 0 46px rgba(4,5,16,.75); }
  /* anello graduato dell'astrolabio */
  .quadrante::before { content:""; position:absolute; inset:8px; z-index:3; pointer-events:none;
    border-radius:inherit; border:1px dashed rgba(240,207,160,.45); }
  .quadrante img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    object-position:center 22%; filter:saturate(1.05) brightness(.95); }
  .quadrante .velo { position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(11,13,36,.2), transparent 32%, transparent 55%, rgba(11,13,36,.95)); }
  .quadrante canvas { position:absolute; inset:0; width:100%; height:100%; }
  /* rosa dei venti in alto */
  .rosa { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:4;
    color:var(--ottone-vivo); font-size:1rem; text-shadow:0 0 12px rgba(240,207,160,.8);
    animation:girarosa 26s linear infinite; pointer-events:none; }
  @keyframes girarosa { to { transform:translateX(-50%) rotate(360deg); } }
  .quadrante .titolo { position:absolute; left:0; right:0; bottom:0; padding:0 20px 22px; z-index:2; }
  .kicker { display:inline-block; font-family:"Cinzel",serif; font-size:.56rem; letter-spacing:.4em;
    text-transform:uppercase; color:var(--ottone); margin-bottom:8px;
    text-shadow:0 0 12px rgba(217,164,91,.7); }
  .quadrante h1 { font-family:"Marcellus",serif; font-weight:400;
    font-size:clamp(1.9rem,8.6vw,2.7rem); line-height:1.06; letter-spacing:.04em;
    color:var(--stella);
    text-shadow:0 0 10px rgba(139,147,232,.6), 0 0 34px rgba(139,147,232,.45), 0 2px 8px #000; }
  .tocca-hint { position:absolute; top:40px; left:50%; transform:translateX(-50%); z-index:4;
    font-family:"Cinzel",serif; font-size:.54rem; letter-spacing:.22em; text-transform:uppercase;
    color:var(--ottone-vivo); background:rgba(11,13,36,.6); border:1px solid rgba(217,164,91,.45);
    border-radius:999px; padding:6px 13px; backdrop-filter:blur(6px); white-space:nowrap;
    animation:brillio 2.8s ease-in-out infinite alternate; }
  @keyframes brillio { from { opacity:.55; } to { opacity:1; } }
  .hero .sotto { padding:16px 10px 6px; }
  .hero .sotto p { color:var(--muted); font-size:.96rem; max-width:34ch; margin:0 auto 14px;
    line-height:1.6; font-style:italic; }
  .cta { display:inline-flex; align-items:center; gap:9px; padding:13px 28px; border-radius:4px;
    font-family:"Cinzel",serif; font-weight:700; font-size:.74rem; letter-spacing:.16em; color:#171029;
    background:linear-gradient(180deg,var(--ottone-vivo),var(--ottone) 60%,#a8743a);
    border:1px solid #8a6134;
    box-shadow:0 0 40px -6px rgba(217,164,91,.8), inset 0 1px 0 rgba(255,255,255,.6);
    position:relative; }
  .cta::before, .cta::after { content:"✦"; font-size:.7rem; }

  /* ══ BENTO: CARTE CELESTI — stessa divisione, cornici d'ottone e stelle ══ */
  .bento-sez { padding:24px 16px 122px; }
  .sez-label { text-align:center; font-family:"Cinzel",serif; font-size:.62rem; letter-spacing:.42em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .sez-label::after { content:"✦ ✧ ✦"; display:block; margin-top:6px; color:var(--ottone);
    letter-spacing:.5em; font-size:.66rem; text-shadow:0 0 10px rgba(217,164,91,.8); }
  .bento { display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:118px; gap:12px; margin-top:12px; }
  .gemma { position:relative; border-radius:8px; overflow:hidden;
    border:1px solid rgba(217,164,91,.55);
    box-shadow:0 0 0 1px #06071a, inset 0 0 0 1px rgba(240,207,160,.14),
      0 14px 34px -14px #000, 0 0 24px -10px rgba(139,147,232,.5); }
  .gemma.grande { grid-column:span 2; grid-row:span 2; }
  .gemma.alta { grid-row:span 2; }
  .gemma img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transition:transform .5s ease; }
  .gemma:active img { transform:scale(1.06); }
  .gemma .velo { position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 45%, rgba(9,10,28,.94)); }
  /* costellazione d'angolo: puntini uniti da segmenti */
  .gemma .costa { position:absolute; top:8px; right:10px; width:34px; height:22px; opacity:.95;
    pointer-events:none; }
  .gemma .costa line { stroke:rgba(240,207,160,.55); stroke-width:1; }
  .gemma .costa circle { fill:var(--stella); }
  .gemma figcaption { position:absolute; left:0; right:0; bottom:0; padding:10px 13px; }
  .gemma h3 { font-family:"Marcellus",serif; font-size:.94rem; letter-spacing:.08em;
    color:var(--stella); text-shadow:0 0 10px rgba(139,147,232,.55); }
  .gemma.grande h3 { font-size:1.14rem; }
  .gemma small { display:block; color:var(--muted); font-size:.73rem; font-style:italic; margin-top:2px; }

  /* nav astri */
  .astri { position:sticky; bottom:14px; margin:14px 2px 0; display:flex; justify-content:space-around;
    align-items:center; padding:10px 8px calc(10px + env(safe-area-inset-bottom));
    border-radius:14px; background:rgba(13,15,40,.88); border:1px solid rgba(217,164,91,.45);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 -4px 44px -12px rgba(139,147,232,.45), 0 20px 40px -18px #000; z-index:10; }
  .astri a { display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none;
    color:var(--muted); font-family:"Cinzel",serif; font-size:.55rem; letter-spacing:.14em;
    text-transform:uppercase; min-width:50px; padding:4px 0; }
  .astri a .s { font-size:.9rem; color:#4a4e7e; transition:all .2s ease; line-height:1;
    font-style:normal; }
  .astri a.on { color:var(--ottone-vivo); }
  .astri a.on .s { color:var(--stella); text-shadow:0 0 14px rgba(245,242,255,.95), 0 0 26px rgba(139,147,232,.8); }

  .badge-opt { position:fixed; top:12px; left:12px; z-index:50; font-family:"Cinzel",serif; font-size:.6rem;
    letter-spacing:.22em; color:#171029; background:linear-gradient(180deg,var(--ottone-vivo),var(--ottone));
    padding:7px 14px; border-radius:999px; box-shadow:0 0 26px -4px rgba(217,164,91,.9); }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; } #cielo{ display:none; } }
</style>
</head>
<body>
  <div class="badge-opt">E · CARTA STELLARE</div>
  <div class="world"><canvas id="cielo"></canvas></div>

  <div class="phone">
    <section class="hero">
      <div class="quadrante" id="quadrante">
        <span class="rosa">✳</span>
        <span class="tocca-hint">✦ tocca: nasce una costellazione</span>
        <img src="/assets/PhotoStory/GruppoLEAF/dragonLeaf.png" alt="Il drago fra le stelle">
        <div class="velo"></div>
        <canvas id="costellazioni"></canvas>
        <div class="titolo">
          <span class="kicker">Cronache di Exanthia · L'Osservatorio</span>
          <h1>Il Mondo<br>di Exanthia</h1>
        </div>
      </div>
      <div class="sotto">
        <p>Ogni storia è una stella fissa. L'astrolabio le tiene in rotta.</p>
        <button class="cta">Leggi le Stelle</button>
      </div>
    </section>

    <section class="bento-sez">
      <div class="sez-label">L'Atlante Celeste</div>
      <div class="bento">
        <figure class="gemma grande">
          <img src="/assets/PhotoStory/GruppoMEAA/drago_fiume.png" alt="">
          <div class="velo"></div>
          <svg class="costa" viewBox="0 0 34 22"><line x1="3" y1="18" x2="14" y2="6"/><line x1="14" y1="6" x2="24" y2="12"/><line x1="24" y1="12" x2="31" y2="4"/><circle cx="3" cy="18" r="1.6"/><circle cx="14" cy="6" r="2"/><circle cx="24" cy="12" r="1.5"/><circle cx="31" cy="4" r="1.7"/></svg>
          <figcaption><h3>Registro degli Eroi</h3><small>Predatori di leggende, in quattro stirpi.</small></figcaption>
        </figure>
        <figure class="gemma alta">
          <img src="/assets/PhotoStory/GruppoMEAA/wolf_alpha.png" alt="">
          <div class="velo"></div>
          <svg class="costa" viewBox="0 0 34 22"><line x1="5" y1="5" x2="16" y2="14"/><line x1="16" y1="14" x2="29" y2="8"/><circle cx="5" cy="5" r="1.7"/><circle cx="16" cy="14" r="2"/><circle cx="29" cy="8" r="1.5"/></svg>
          <figcaption><h3>Mercato Nero</h3><small>Merci sotto stelle mute.</small></figcaption>
        </figure>
        <figure class="gemma">
          <img src="/assets/PhotoStory/GruppoMEAA/abominio.png" alt="">
          <div class="velo"></div>
          <svg class="costa" viewBox="0 0 34 22"><line x1="4" y1="14" x2="17" y2="5"/><line x1="17" y1="5" x2="30" y2="16"/><circle cx="4" cy="14" r="1.6"/><circle cx="17" cy="5" r="2"/><circle cx="30" cy="16" r="1.5"/></svg>
          <figcaption><h3>Memorie</h3><small>Le cronache dei party.</small></figcaption>
        </figure>
        <figure class="gemma">
          <img src="/assets/PhotoStory/GruppoMEAA/karathep.png" alt="">
          <div class="velo"></div>
          <svg class="costa" viewBox="0 0 34 22"><line x1="6" y1="6" x2="15" y2="16"/><line x1="15" y1="16" x2="28" y2="10"/><circle cx="6" cy="6" r="1.5"/><circle cx="15" cy="16" r="2"/><circle cx="28" cy="10" r="1.6"/></svg>
          <figcaption><h3>L'Oracolo</h3><small>1 responso al giorno.</small></figcaption>
        </figure>
      </div>

      <nav class="astri">
        <a class="on" href="#"><span class="s">✦</span>Home</a>
        <a href="#"><span class="s">✦</span>Mondo</a>
        <a href="#"><span class="s">✦</span>Eroi</a>
        <a href="#"><span class="s">✦</span>Gilda</a>
        <a href="#"><span class="s">✦</span>Menu</a>
      </nav>
    </section>
  </div>

<script>
  /* Cielo del mondo: stelle fisse che scintillano + una cometa ogni tanto */
  const cv=document.getElementById('cielo'), cx=cv.getContext('2d');
  let W,H,st=[],com=null;
  const rs=()=>{ W=cv.width=innerWidth; H=cv.height=innerHeight;
    st=Array.from({length:W<600?70:130},()=>({x:Math.random()*W,y:Math.random()*H,
      r:.5+Math.random()*1.2, ph:Math.random()*7, s:.5+Math.random()})); };
  rs(); addEventListener('resize',rs);
  let t=0;
  (function tick(){ t++; cx.clearRect(0,0,W,H);
    for(const s of st){ const a=.2+.75*Math.abs(Math.sin(t/70*s.s+s.ph));
      cx.fillStyle=`rgba(245,242,255,${a.toFixed(2)})`;
      cx.beginPath(); cx.arc(s.x,s.y,s.r,0,7); cx.fill(); }
    if(!com && Math.random()<.003) com={x:-30,y:Math.random()*H*.4,vx:6+Math.random()*3,vy:1.2};
    if(com){ com.x+=com.vx; com.y+=com.vy;
      const gr=cx.createLinearGradient(com.x-46,com.y-9,com.x,com.y);
      gr.addColorStop(0,'rgba(240,207,160,0)'); gr.addColorStop(1,'rgba(240,207,160,.85)');
      cx.strokeStyle=gr; cx.lineWidth=1.6;
      cx.beginPath(); cx.moveTo(com.x-46,com.y-9); cx.lineTo(com.x,com.y); cx.stroke();
      cx.fillStyle='rgba(255,250,240,.95)';
      cx.beginPath(); cx.arc(com.x,com.y,1.8,0,7); cx.fill();
      if(com.x>W+60) com=null; }
    requestAnimationFrame(tick);
  })();

  /* FEATURE: tocca il quadrante → nasce una costellazione dal punto */
  const qd=document.getElementById('quadrante'), oc=document.getElementById('costellazioni'), ox=oc.getContext('2d');
  let SW,SH,costs=[];
  const rs2=()=>{ const r=qd.getBoundingClientRect(); SW=oc.width=r.width; SH=oc.height=r.height; };
  rs2(); addEventListener('resize',rs2);
  qd.addEventListener('pointerdown', e=>{
    const r=qd.getBoundingClientRect(); let x=e.clientX-r.left, y=e.clientY-r.top;
    const pts=[{x,y}];
    const n=3+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){ const an=Math.random()*Math.PI*2, d=26+Math.random()*46;
      x=Math.max(8,Math.min(SW-8,x+Math.cos(an)*d));
      y=Math.max(8,Math.min(SH-8,y+Math.sin(an)*d));
      pts.push({x,y}); }
    costs.push({pts, life:210, born:0});
    if(costs.length>5) costs.shift();
  });
  (function tick2(){
    ox.clearRect(0,0,SW,SH);
    for(let i=costs.length-1;i>=0;i--){ const c=costs[i];
      c.life--; c.born+=.035;
      if(c.life<=0){ costs.splice(i,1); continue; }
      const a=Math.min(1,c.life/70);
      const reveal=Math.min(c.pts.length-1, c.born*(c.pts.length-1));
      ox.strokeStyle=`rgba(240,207,160,${(a*.8).toFixed(2)})`; ox.lineWidth=1.1;
      ox.beginPath(); ox.moveTo(c.pts[0].x,c.pts[0].y);
      for(let k=1;k<=Math.floor(reveal);k++) ox.lineTo(c.pts[k].x,c.pts[k].y);
      if(reveal%1>0 && Math.floor(reveal)<c.pts.length-1){
        const p=c.pts[Math.floor(reveal)], q=c.pts[Math.floor(reveal)+1], f=reveal%1;
        ox.lineTo(p.x+(q.x-p.x)*f, p.y+(q.y-p.y)*f); }
      ox.stroke();
      for(const p of c.pts){
        ox.fillStyle=`rgba(245,242,255,${(a*.95).toFixed(2)})`;
        ox.shadowColor='rgba(139,147,232,.9)'; ox.shadowBlur=8;
        ox.beginPath(); ox.arc(p.x,p.y,1.8,0,7); ox.fill(); }
      ox.shadowBlur=0; }
    requestAnimationFrame(tick2);
  })();
</script>
</body>
</html>
