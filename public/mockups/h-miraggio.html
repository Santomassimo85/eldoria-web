<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOCKUP H — Carovana del Miraggio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --crepuscolo:#2b1230; --vino:#5a1f3d; --brace:#c2503a; --ambra:#e8944a;
    --sole:#ffd9a0; --sabbia:#d9a06b; --ink:#fdf3e7; --muted:#c9a58f;
  }
  html, body { height:100%; }
  body { background:var(--crepuscolo); color:var(--ink); font-family:"Cormorant Garamond",Georgia,serif; overflow:hidden; }

  /* ── IL DESERTO: cielo che vira, sole che pulsa, dune che scivolano ── */
  .world { position:fixed; inset:0; overflow:hidden;
    background:linear-gradient(180deg,#1d0c26,var(--crepuscolo) 30%,var(--vino) 58%,#7c2c3e 78%,#a34338); }
  .world::after { content:""; position:absolute; inset:0; mix-blend-mode:overlay; opacity:.5;
    background:linear-gradient(180deg, transparent 40%, rgba(232,148,74,.6));
    animation:vira 14s ease-in-out infinite alternate; }
  @keyframes vira { from { opacity:.3; } to { opacity:.65; } }
  #vento { position:absolute; inset:0; z-index:3; }

  .phone { position:relative; width:min(430px,100vw); height:100dvh; max-height:930px;
    margin:0 auto; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; background:transparent; }
  .phone::-webkit-scrollbar{ display:none; }
  @media (min-width:520px){
    .phone { height:92vh; margin-top:4vh; border-radius:42px; border:1px solid rgba(232,148,74,.45);
      box-shadow:0 0 0 8px #241028, 0 0 90px -22px rgba(232,148,74,.5), 0 40px 120px -30px #000;
      overflow-y:auto; }
  }

  /* ── TESTATA: il sole cala dietro le dune ── */
  .orizzonte { position:relative; height:64dvh; min-height:420px; max-height:560px; overflow:hidden; }
  .sole { position:absolute; left:50%; top:16%; transform:translateX(-50%);
    width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle at 46% 40%, #fff2d8, var(--sole) 45%, var(--ambra) 80%, transparent 82%);
    box-shadow:0 0 80px 26px rgba(255,217,160,.45), 0 0 160px 60px rgba(232,148,74,.25);
    animation:cala 22s ease-in-out infinite alternate; }
  @keyframes cala { from { transform:translate(-50%,0) scale(1); }
    to { transform:translate(-50%,26px) scale(1.06); } }
  /* stormo che attraversa il cielo */
  .stormo { position:absolute; top:16%; left:-12%; font-size:.72rem; color:rgba(29,12,38,.85);
    letter-spacing:.5em; animation:migra 26s linear infinite; }
  @keyframes migra { to { transform:translateX(140vw) translateY(-30px); } }
  /* dune: tre strati che scivolano a velocità diverse */
  .duna { position:absolute; left:-25%; width:150%; height:34%; border-radius:48% 52% 0 0 / 92% 88% 0 0; }
  .duna.d1 { bottom:-6%;  background:linear-gradient(180deg,#3a1626,#241028);
    animation:scivola 34s ease-in-out infinite alternate; }
  .duna.d2 { bottom:-11%; height:30%; background:linear-gradient(180deg,#6d2b3c,#3a1626);
    border-radius:55% 45% 0 0 / 95% 80% 0 0;
    animation:scivola 26s ease-in-out infinite alternate-reverse; }
  .duna.d3 { bottom:-16%; height:26%; background:linear-gradient(180deg,#a34a3a,#6d2b3c);
    border-radius:42% 58% 0 0 / 85% 95% 0 0;
    animation:scivola 19s ease-in-out infinite alternate; }
  @keyframes scivola { from { transform:translateX(-3%); } to { transform:translateX(3%); } }
  .orizzonte .titolo { position:absolute; left:0; right:0; bottom:26px; z-index:4; text-align:center; padding:0 22px; }
  .kicker { font-family:"Cinzel",serif; font-size:.58rem; letter-spacing:.44em; text-transform:uppercase;
    color:var(--sole); text-shadow:0 0 14px rgba(255,217,160,.8); }
  .orizzonte h1 { font-family:"Cormorant Garamond",serif; font-weight:700; margin-top:10px;
    font-size:clamp(2.4rem,11.4vw,3.2rem); line-height:.98; letter-spacing:.01em;
    color:var(--ink); text-shadow:0 4px 22px rgba(29,12,38,.8); }
  .orizzonte h1 em { font-style:italic; font-weight:500;
    background:linear-gradient(90deg,var(--sole),var(--ambra));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .orizzonte p { margin-top:8px; color:var(--muted); font-style:italic; font-size:1rem; }

  /* ── LE CAROVANE: file orizzontali che si sfogliano col pollice ── */
  .carovane { position:relative; z-index:5; padding:10px 0 96px;
    background:linear-gradient(180deg, transparent, #241028 60px); }
  .cartello { display:flex; align-items:baseline; gap:12px; padding:18px 20px 10px; }
  .cartello h2 { font-family:"Cinzel",serif; font-weight:600; font-size:.72rem;
    letter-spacing:.36em; text-transform:uppercase; color:var(--sole); white-space:nowrap; }
  .cartello i { flex:1; height:1px; background:linear-gradient(90deg, rgba(232,148,74,.6), transparent); }
  .cartello small { font-family:"Cinzel",serif; font-size:.56rem; letter-spacing:.2em;
    color:var(--muted); text-transform:uppercase; }
  .fila { display:flex; gap:14px; overflow-x:auto; scrollbar-width:none; padding:6px 20px 10px;
    scroll-snap-type:x mandatory; }
  .fila::-webkit-scrollbar{ display:none; }
  .tenda { position:relative; flex:0 0 66%; aspect-ratio:4/5; border-radius:18px 18px 60px 18px;
    overflow:hidden; scroll-snap-align:start;
    border:1px solid rgba(232,148,74,.5);
    box-shadow:0 16px 34px -16px #000, 0 0 26px -12px rgba(232,148,74,.7); }
  .fila.bassa .tenda { flex:0 0 42%; aspect-ratio:4/4.6; border-radius:16px 16px 44px 16px; }
  .tenda img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:saturate(1.08) sepia(.12); }
  .tenda .velo { position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(29,12,38,.05) 40%, rgba(29,12,38,.94)); }
  .tenda .nappa { position:absolute; top:0; right:16px; width:2px; height:26px;
    background:linear-gradient(180deg,var(--ambra),transparent); }
  .tenda .nappa::after { content:""; position:absolute; bottom:-5px; left:-3px; width:8px; height:8px;
    border-radius:50%; background:var(--sole); box-shadow:0 0 10px rgba(255,217,160,.9); }
  .tenda figcaption { position:absolute; left:0; right:0; bottom:0; padding:12px 14px 14px; }
  .tenda h3 { font-family:"Cormorant Garamond",serif; font-weight:700; font-size:1.2rem;
    line-height:1.05; color:var(--ink); }
  .fila.bassa .tenda h3 { font-size:1rem; }
  .tenda small { display:block; color:var(--muted); font-size:.76rem; font-style:italic; margin-top:3px; }
  /* invito a sfogliare: carovana che ondeggia da sola */
  .fila .tenda { animation:passo 7s ease-in-out infinite; }
  .fila .tenda:nth-child(2) { animation-delay:.4s; }
  .fila .tenda:nth-child(3) { animation-delay:.8s; }
  @keyframes passo { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }

  /* ── nav: la PISTA — tessuto intrecciato con perline d'ambra ── */
  .pista { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom));
    width:min(398px, calc(100vw - 24px)); z-index:30;
    display:flex; justify-content:space-around; align-items:center;
    padding:11px 8px; border-radius:16px;
    background:
      repeating-linear-gradient(90deg, rgba(232,148,74,.08) 0 8px, transparent 8px 16px),
      linear-gradient(180deg,#33142e,#241028);
    border:1px solid rgba(232,148,74,.5);
    box-shadow:0 -4px 40px -12px rgba(232,148,74,.55), 0 18px 40px -18px #000; }
  @media (min-width:520px){ .pista { position:sticky; margin:0 auto; } }
  .pista a { display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none;
    color:var(--muted); font-family:"Cinzel",serif; font-size:.55rem; letter-spacing:.14em;
    text-transform:uppercase; min-width:50px; padding:2px 0; }
  .pista a .p { width:9px; height:9px; transform:rotate(45deg); background:#5c2e38;
    border:1px solid rgba(232,148,74,.4); transition:all .2s ease; }
  .pista a.on { color:var(--sole); }
  .pista a.on .p { background:var(--sole); border-color:var(--sole);
    box-shadow:0 0 12px rgba(255,217,160,1); }

  .badge-opt { position:fixed; top:12px; left:12px; z-index:50; font-family:"Cinzel",serif; font-size:.6rem;
    letter-spacing:.22em; color:#3a1626; background:linear-gradient(90deg,var(--sole),var(--ambra));
    padding:7px 14px; border-radius:999px; box-shadow:0 0 26px -4px rgba(232,148,74,.9); }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; } #vento{ display:none; } }
</style>
</head>
<body>
  <div class="badge-opt">H · CAROVANA DEL MIRAGGIO</div>
  <div class="world"><canvas id="vento"></canvas></div>

  <div class="phone">
    <header class="orizzonte">
      <div class="sole"></div>
      <span class="stormo">˯ ˯ ˯</span>
      <div class="duna d1"></div>
      <div class="duna d2"></div>
      <div class="duna d3"></div>
      <div class="titolo">
        <span class="kicker">Cronache di Exanthia · Il Miraggio</span>
        <h1>Il Mondo <em>di Exanthia</em></h1>
        <p>Ogni storia è un'oasi. La carovana non si ferma.</p>
      </div>
    </header>

    <main class="carovane">
      <div class="cartello"><h2>Le Vie del Regno</h2><i></i><small>sfoglia →</small></div>
      <div class="fila">
        <figure class="tenda">
          <img src="/assets/PhotoStory/GruppoLEAF/dragonLeaf.png" alt="">
          <div class="velo"></div><span class="nappa"></span>
          <figcaption><h3>Registro degli Eroi</h3><small>Predatori di leggende, in quattro stirpi.</small></figcaption>
        </figure>
        <figure class="tenda">
          <img src="/assets/PhotoStory/GruppoMEAA/wolf_alpha.png" alt="">
          <div class="velo"></div><span class="nappa"></span>
          <figcaption><h3>Mercato Nero</h3><small>Merci che viaggiano di notte.</small></figcaption>
        </figure>
        <figure class="tenda">
          <img src="/assets/PhotoStory/GruppoMEAA/drago_fiume.png" alt="">
          <div class="velo"></div><span class="nappa"></span>
          <figcaption><h3>Atlante</h3><small>Le terre oltre le dune.</small></figcaption>
        </figure>
      </div>

      <div class="cartello"><h2>Racconti al Fuoco</h2><i></i><small>sfoglia →</small></div>
      <div class="fila bassa">
        <figure class="tenda">
          <img src="/assets/PhotoStory/GruppoLAC/horn_spider.jpg" alt="">
          <div class="velo"></div><span class="nappa"></span>
          <figcaption><h3>Memorie</h3><small>Le cronache dei party.</small></figcaption>
        </figure>
        <figure class="tenda">
          <img src="/assets/PhotoStory/GruppoMEAA/karathep.png" alt="">
          <div class="velo"></div><span class="nappa"></span>
          <figcaption><h3>L'Oracolo</h3><small>1 responso al giorno.</small></figcaption>
        </figure>
        <figure class="tenda">
          <img src="/assets/PhotoStory/GruppoMEAA/abominio.png" alt="">
          <div class="velo"></div><span class="nappa"></span>
          <figcaption><h3>Bestiario</h3><small>Ciò che il miraggio nasconde.</small></figcaption>
        </figure>
      </div>
    </main>

    <nav class="pista">
      <a class="on" href="#"><span class="p"></span>Home</a>
      <a href="#"><span class="p"></span>Mondo</a>
      <a href="#"><span class="p"></span>Eroi</a>
      <a href="#"><span class="p"></span>Gilda</a>
      <a href="#"><span class="p"></span>Menu</a>
    </nav>
  </div>

<script>
  /* sabbia portata dal vento: scie orizzontali continue, nessuna azione richiesta */
  const cv=document.getElementById('vento'), cx=cv.getContext('2d');
  let W,H,gr=[];
  const rs=()=>{ W=cv.width=innerWidth; H=cv.height=innerHeight;
    gr=Array.from({length:W<600?40:70},()=>({x:Math.random()*W, y:H*.45+Math.random()*H*.55,
      v:.7+Math.random()*1.6, l:6+Math.random()*14, ph:Math.random()*7})); };
  rs(); addEventListener('resize',rs);
  let t=0;
  (function tick(){ t++; cx.clearRect(0,0,W,H);
    for(const g of gr){
      g.x+=g.v; g.y+=Math.sin(t/40+g.ph)*.35;
      if(g.x>W+20){ g.x=-20; g.y=H*.45+Math.random()*H*.55; }
      const a=.1+.25*Math.abs(Math.sin(t/50+g.ph));
      const grd=cx.createLinearGradient(g.x-g.l,g.y,g.x,g.y);
      grd.addColorStop(0,'rgba(255,217,160,0)'); grd.addColorStop(1,`rgba(255,217,160,${a.toFixed(2)})`);
      cx.strokeStyle=grd; cx.lineWidth=1;
      cx.beginPath(); cx.moveTo(g.x-g.l,g.y+g.l*.14); cx.lineTo(g.x,g.y); cx.stroke(); }
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
