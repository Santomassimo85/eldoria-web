<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOCKUP D — Selva Lucente</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --muschio:#0b1408; --felce:#122413; --lucciola:#d9f79b; --linfa:#7fd06a;
    --fiore:#c99df0; --ink:#eef7e6; --muted:#93a887;
  }
  html, body { height:100%; }
  body { background:var(--muschio); color:var(--ink); font-family:"Cormorant Garamond",Georgia,serif; overflow:hidden; }

  .world { position:fixed; inset:0; overflow:hidden;
    background:
      radial-gradient(60% 50% at 20% 100%, rgba(127,208,106,.12), transparent 60%),
      radial-gradient(50% 40% at 85% 90%, rgba(201,157,240,.08), transparent 60%),
      linear-gradient(180deg,#101d0d,#0b1408 55%,#060a05); }
  /* fronde scure che incorniciano il mondo */
  .world::before { content:""; position:absolute; inset:0; opacity:.5;
    background:
      radial-gradient(42% 30% at 0% 0%, #050a04 30%, transparent 70%),
      radial-gradient(42% 30% at 100% 0%, #050a04 30%, transparent 70%); }
  #lucciole { position:absolute; inset:0; }

  .phone { position:relative; width:min(430px,100vw); height:100dvh; max-height:930px;
    margin:0 auto; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; background:#0c1509; }
  .phone::-webkit-scrollbar{ display:none; }
  @media (min-width:520px){
    .phone { height:92vh; margin-top:4vh; border-radius:46px; border:1px solid rgba(127,208,106,.4);
      box-shadow:0 0 0 8px #0e1a0b, 0 0 90px -22px rgba(217,247,155,.45), 0 40px 120px -30px #000; }
  }

  /* ══ HERO: CUORE DELLA SELVA — cornice organica di linfa ══ */
  .hero { position:relative; padding:54px 18px 8px; text-align:center; }
  .radura { position:relative; margin:0 auto; width:100%; max-width:372px; aspect-ratio:3/3.3;
    overflow:hidden; cursor:pointer; user-select:none;
    border-radius:46% 54% 42% 58% / 34% 30% 22% 26%;
    border:2px solid rgba(127,208,106,.6);
    box-shadow:0 0 0 6px rgba(18,36,19,.9), 0 0 0 7px rgba(127,208,106,.25),
      0 0 60px -12px rgba(217,247,155,.5), inset 0 0 50px rgba(4,8,3,.8);
    animation:respiro 9s ease-in-out infinite alternate; }
  @keyframes respiro {
    from { border-radius:46% 54% 42% 58% / 34% 30% 22% 26%; }
    to   { border-radius:54% 46% 58% 42% / 30% 34% 26% 22%; } }
  .radura img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    object-position:center 30%; filter:saturate(1.1) brightness(.9); }
  .radura .velo { position:absolute; inset:0;
    background:
      radial-gradient(80% 60% at 50% 0%, rgba(217,247,155,.12), transparent 55%),
      linear-gradient(180deg, rgba(11,20,8,.15), transparent 35%, transparent 55%, rgba(11,20,8,.95)); }
  .radura canvas { position:absolute; inset:0; width:100%; height:100%; }
  /* felci ornamentali agli angoli */
  .felce-orn { position:absolute; z-index:3; font-size:1.5rem; color:var(--linfa); opacity:.9;
    text-shadow:0 0 12px rgba(127,208,106,.8); pointer-events:none; }
  .felce-orn.tl { top:10px; left:16px; transform:rotate(-24deg); }
  .felce-orn.br { bottom:10px; right:16px; transform:rotate(156deg); }
  .radura .titolo { position:absolute; left:0; right:0; bottom:0; padding:0 20px 24px; z-index:2; }
  .kicker { display:inline-block; font-family:"Cinzel",serif; font-size:.58rem; letter-spacing:.4em;
    text-transform:uppercase; color:var(--fiore); margin-bottom:8px;
    text-shadow:0 0 14px rgba(201,157,240,.8); }
  .radura h1 { font-family:"Cormorant Garamond",serif; font-weight:600; font-style:italic;
    font-size:clamp(2rem,9.4vw,2.9rem); line-height:1.02; letter-spacing:.01em;
    background:linear-gradient(180deg,#fbffe9,var(--lucciola) 45%,var(--linfa) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 18px rgba(217,247,155,.4)); }
  .tocca-hint { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:4;
    font-family:"Cinzel",serif; font-size:.54rem; letter-spacing:.22em; text-transform:uppercase;
    color:var(--lucciola); background:rgba(11,20,8,.6); border:1px solid rgba(127,208,106,.45);
    border-radius:999px; padding:6px 13px; backdrop-filter:blur(6px); white-space:nowrap;
    animation:lume 3s ease-in-out infinite alternate; }
  @keyframes lume { from { opacity:.55; } to { opacity:1; } }
  .hero .sotto { padding:16px 10px 6px; }
  .hero .sotto p { color:var(--muted); font-size:1.02rem; max-width:34ch; margin:0 auto 14px;
    line-height:1.55; font-style:italic; }
  .cta { display:inline-flex; align-items:center; gap:9px; padding:13px 30px; border-radius:999px;
    font-family:"Cinzel",serif; font-weight:700; font-size:.74rem; letter-spacing:.14em; color:#122408;
    background:linear-gradient(180deg,#f2ffd0,var(--lucciola) 55%,#a8d95c);
    border:1px solid rgba(127,208,106,.7);
    box-shadow:0 0 40px -6px rgba(217,247,155,.8), inset 0 1px 0 rgba(255,255,255,.7); }

  /* ══ BENTO DEL SOTTOBOSCO: stessa divisione, cornici di linfa organiche ══ */
  .bento-sez { padding:24px 16px 122px; }
  .sez-label { text-align:center; font-family:"Cinzel",serif; font-size:.62rem; letter-spacing:.42em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .sez-label::after { content:"❦"; display:block; margin-top:6px; color:var(--linfa);
    text-shadow:0 0 12px rgba(127,208,106,.9); font-size:.9rem; }
  .bento { display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:118px; gap:12px; margin-top:12px; }
  .gemma { position:relative; overflow:hidden;
    border:1.5px solid rgba(127,208,106,.5);
    box-shadow:0 0 0 4px rgba(18,36,19,.8), 0 14px 34px -14px #000,
      0 0 24px -10px rgba(217,247,155,.5); }
  .gemma:nth-child(odd)  { border-radius:26px 12px 26px 12px; }
  .gemma:nth-child(even) { border-radius:12px 26px 12px 26px; }
  .gemma.grande { grid-column:span 2; grid-row:span 2; border-radius:34px 14px 34px 14px; }
  .gemma.alta { grid-row:span 2; }
  .gemma img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:saturate(1.1); transition:transform .5s ease; }
  .gemma:active img { transform:scale(1.06); }
  .gemma .velo { position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 45%, rgba(8,14,6,.94)); }
  .gemma .germoglio { position:absolute; top:8px; left:10px; color:var(--linfa); font-size:.9rem;
    text-shadow:0 0 10px rgba(127,208,106,.9); }
  .gemma figcaption { position:absolute; left:0; right:0; bottom:0; padding:10px 14px; }
  .gemma h3 { font-family:"Cormorant Garamond",serif; font-weight:600; font-style:italic;
    font-size:1.06rem; letter-spacing:.02em; color:var(--lucciola); }
  .gemma.grande h3 { font-size:1.3rem; }
  .gemma small { display:block; color:var(--muted); font-size:.74rem; font-style:italic; margin-top:2px; }

  /* nav radici */
  .radici { position:sticky; bottom:14px; margin:14px 2px 0; display:flex; justify-content:space-around;
    align-items:center; padding:10px 8px calc(10px + env(safe-area-inset-bottom));
    border-radius:999px; background:rgba(12,21,9,.88); border:1px solid rgba(127,208,106,.45);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 -4px 44px -12px rgba(217,247,155,.4), 0 20px 40px -18px #000; z-index:10; }
  .radici a { display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none;
    color:var(--muted); font-family:"Cinzel",serif; font-size:.55rem; letter-spacing:.14em;
    text-transform:uppercase; min-width:50px; padding:4px 0; position:relative; }
  .radici a .l { width:8px; height:8px; border-radius:50%; background:#2c4526;
    box-shadow:0 0 0 3px rgba(127,208,106,.15); transition:all .2s ease; margin-bottom:2px; }
  .radici a.on { color:var(--lucciola); }
  .radici a.on .l { background:var(--lucciola);
    box-shadow:0 0 14px rgba(217,247,155,1), 0 0 0 3px rgba(127,208,106,.3); }

  .badge-opt { position:fixed; top:12px; left:12px; z-index:50; font-family:"Cinzel",serif; font-size:.6rem;
    letter-spacing:.22em; color:#122408; background:linear-gradient(180deg,#f2ffd0,var(--lucciola));
    padding:7px 14px; border-radius:999px; box-shadow:0 0 26px -4px rgba(217,247,155,.9); }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; } #lucciole{ display:none; } }
</style>
</head>
<body>
  <div class="badge-opt">D · SELVA LUCENTE</div>
  <div class="world"><canvas id="lucciole"></canvas></div>

  <div class="phone">
    <section class="hero">
      <div class="radura" id="radura">
        <span class="tocca-hint">✧ tocca: le lucciole accorrono</span>
        <img src="/assets/PhotoStory/GruppoLAC/horn_spider.jpg" alt="Il cuore della selva">
        <div class="velo"></div>
        <span class="felce-orn tl">❧</span>
        <span class="felce-orn br">❧</span>
        <canvas id="sciame"></canvas>
        <div class="titolo">
          <span class="kicker">Cronache di Exanthia · La Selva</span>
          <h1>Il Mondo<br>di Exanthia</h1>
        </div>
      </div>
      <div class="sotto">
        <p>Dove la linfa brilla, le storie mettono radici. Segui le lucciole.</p>
        <button class="cta">❦ Entra nella Selva</button>
      </div>
    </section>

    <section class="bento-sez">
      <div class="sez-label">Il Sottobosco delle Storie</div>
      <div class="bento">
        <figure class="gemma grande">
          <img src="/assets/PhotoStory/GruppoLEAF/dragonLeaf.png" alt="">
          <div class="velo"></div><span class="germoglio">❧</span>
          <figcaption><h3>Registro degli Eroi</h3><small>Predatori di leggende, in quattro stirpi.</small></figcaption>
        </figure>
        <figure class="gemma alta">
          <img src="/assets/PhotoStory/GruppoMEAA/wolf_alpha.png" alt="">
          <div class="velo"></div><span class="germoglio">❧</span>
          <figcaption><h3>Mercato Nero</h3><small>Merci nascoste tra le radici.</small></figcaption>
        </figure>
        <figure class="gemma">
          <img src="/assets/PhotoStory/GruppoMEAA/abominio.png" alt="">
          <div class="velo"></div><span class="germoglio">❧</span>
          <figcaption><h3>Memorie</h3><small>Le cronache dei party.</small></figcaption>
        </figure>
        <figure class="gemma">
          <img src="/assets/PhotoStory/GruppoMEAA/karathep.png" alt="">
          <div class="velo"></div><span class="germoglio">❧</span>
          <figcaption><h3>L'Oracolo</h3><small>1 responso al giorno.</small></figcaption>
        </figure>
      </div>

      <nav class="radici">
        <a class="on" href="#"><span class="l"></span>Home</a>
        <a href="#"><span class="l"></span>Mondo</a>
        <a href="#"><span class="l"></span>Eroi</a>
        <a href="#"><span class="l"></span>Gilda</a>
        <a href="#"><span class="l"></span>Menu</a>
      </nav>
    </section>
  </div>

<script>
  /* Lucciole nel mondo: vagano lente, pulsano */
  const lv=document.getElementById('lucciole'), lx=lv.getContext('2d');
  let W,H,ff=[];
  const rs=()=>{ W=lv.width=innerWidth; H=lv.height=innerHeight;
    ff=Array.from({length:W<600?26:46},()=>({x:Math.random()*W,y:Math.random()*H,
      a:Math.random()*7, v:.15+Math.random()*.3, ph:Math.random()*7,
      vi:Math.random()<.85?'217,247,155':'201,157,240'})); };
  rs(); addEventListener('resize',rs);
  let t=0;
  (function tick(){ t++; lx.clearRect(0,0,W,H);
    for(const f of ff){
      f.a+=(Math.random()-.5)*.3; f.x+=Math.cos(f.a)*f.v; f.y+=Math.sin(f.a)*f.v;
      if(f.x<-10)f.x=W+10; if(f.x>W+10)f.x=-10; if(f.y<-10)f.y=H+10; if(f.y>H+10)f.y=-10;
      const al=.25+.7*Math.abs(Math.sin(t/60+f.ph));
      lx.fillStyle=`rgba(${f.vi},${al.toFixed(2)})`;
      lx.shadowColor=`rgba(${f.vi},.9)`; lx.shadowBlur=8;
      lx.beginPath(); lx.arc(f.x,f.y,1.4,0,7); lx.fill(); }
    lx.shadowBlur=0;
    requestAnimationFrame(tick);
  })();

  /* FEATURE: tocca la radura → uno sciame di lucciole accorre al punto */
  const rad=document.getElementById('radura'), sc=document.getElementById('sciame'), sx=sc.getContext('2d');
  let SW,SH,sw=[];
  const rs2=()=>{ const r=rad.getBoundingClientRect(); SW=sc.width=r.width; SH=sc.height=r.height; };
  rs2(); addEventListener('resize',rs2);
  rad.addEventListener('pointerdown', e=>{
    const r=rad.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    for(let i=0;i<16;i++){ const an=Math.random()*Math.PI*2, d=40+Math.random()*90;
      sw.push({x:x+Math.cos(an)*d, y:y+Math.sin(an)*d, tx:x, ty:y, life:110, ph:Math.random()*7}); }
    if(sw.length>90) sw.splice(0, sw.length-90);
  });
  (function tick2(){
    sx.clearRect(0,0,SW,SH);
    for(let i=sw.length-1;i>=0;i--){ const s=sw[i];
      s.life--; if(s.life<=0){ sw.splice(i,1); continue; }
      s.x+=(s.tx-s.x)*.045+Math.sin(s.life/6+s.ph)*.7;
      s.y+=(s.ty-s.y)*.045+Math.cos(s.life/7+s.ph)*.7;
      const a=Math.min(1,s.life/50);
      sx.fillStyle=`rgba(217,247,155,${(a*.95).toFixed(2)})`;
      sx.shadowColor='rgba(217,247,155,.9)'; sx.shadowBlur=10;
      sx.beginPath(); sx.arc(s.x,s.y,1.6,0,7); sx.fill(); }
    sx.shadowBlur=0;
    requestAnimationFrame(tick2);
  })();
</script>
</body>
</html>
